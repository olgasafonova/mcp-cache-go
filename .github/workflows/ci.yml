name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      # Supply-chain checks. This module is imported by every MCP server in the
      # portfolio, so it carries the gleif-mcp-server supply-chain steps rather
      # than mcp-otel-go's lighter set (rules/mcp-server-patterns.md).
      - name: Verify module checksums
        run: go mod verify

      - name: Check go.sum is current
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum drifted. Run 'go mod tidy' and commit."; exit 1; }

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -failfast -v ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # Pinned: x/vuln v1.8.0 (09-2026) requires go >= 1.26 and fails to
      # install under GOTOOLCHAIN=local on the 1.25 runner. v1.7.0 is the
      # last release that builds on 1.25; the vulnerability DB is fetched
      # at run time, so the pin does not stale the findings. Unpin when
      # go-version moves to 1.26. Same fix as miro-mcp-server.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # Deliberately `latest` rather than a pin. A pinned v2.7.2 produced six
      # SA5011 false positives across miro-mcp-server and nordic-registry-mcp-server
      # on 29-07-2026, because older staticcheck does not model
      # (*testing.T).Fatal as non-returning.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: go vet
        run: go vet ./...
